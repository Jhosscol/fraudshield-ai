name: FraudShield — Re-entrenamiento automático

on:
  # TRIGGER 1: Drift del modelo (se activa manualmente desde GitHub)
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Razón del re-entrenamiento"
        required: false
        default: "drift_detected"
        type: choice
        options:
          - drift_detected
          - manual

  # TRIGGER 2: Nuevo dataset subido al repo
  push:
    paths:
      - "app/data/dataset.csv"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Determinar trigger
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "type=data" >> $GITHUB_OUTPUT
          else
            echo "type=drift" >> $GITHUB_OUTPUT
          fi

      - name: Re-entrenar modelo
        run: python retrain.py ${{ steps.trigger.outputs.type }}

      - name: Commit modelos y métricas al repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/models/*.pkl metrics/latest_metrics.json
          git diff --staged --quiet || git commit -m "chore: modelos re-entrenados [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen del pipeline
        if: always()
        run: |
          echo "### Re-entrenamiento completado" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ steps.trigger.outputs.type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Fecha: $(date)" >> $GITHUB_STEP_SUMMARY
          if [ -f metrics/latest_metrics.json ]; then
            echo "- Métricas: $(cat metrics/latest_metrics.json)" >> $GITHUB_STEP_SUMMARY
          fi